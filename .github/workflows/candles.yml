name: Spot candle bridge
on:
  schedule:
    # 15-minute cadence, away from the busiest :00 schedule; execution may be delayed.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spot-candle-bridge
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch real SPOT OHLCV bars
        run: python3 fetch_candles.py
      - name: Commit candle snapshot only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update closed spot candles [skip ci]'
            git push
          fi
