name: Lattia & Katto backtest
on:
  push:
    branches: [claude/lattia-katto-v3]
    paths: ['backtest/lattia_katto.py', 'backtest/run.py', 'tests/test_lattia_katto.py', '.github/workflows/lattia-katto-backtest.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lattia-katto-backtest
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.2.6 pandas==2.2.2
      - name: Candle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/candles
          key: lattia-katto-candles-2023-01-01-2026-10-18-v1
      - name: Engine tests
        run: python -m unittest tests/test_lattia_katto.py -v
      - name: Probe data endpoints
        run: |
          curl -s -o /dev/null -w 'binance %{http_code}\n' 'https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=2' || true
          curl -s -o /dev/null -w 'bybit %{http_code}\n' 'https://api.bybit.com/v5/market/kline?category=spot&symbol=BTCUSDT&interval=60&limit=2' || true
      - name: Backtest
        timeout-minutes: 30
        run: python -m backtest.run --out data/lattia-katto
      - name: Save results to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lattia-katto
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Lattia & Katto backtest results'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
