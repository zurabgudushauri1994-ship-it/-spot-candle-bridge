name: Bybit Radar historical backtest
on:
  workflow_dispatch:
    inputs:
      days: {description: 'Bybit Spot history days (90 minimum)', required: true, default: '90'}
  schedule:
    - cron: '43 3 * * 1'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install numpy==2.2.6 pandas==2.2.2
      - run: python -m radar.research --days '${{ inputs.days || 90 }}'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar/backtest-latest.json
          git diff --cached --quiet || (git commit -m 'Update Bybit Radar historical backtest' && git push)
