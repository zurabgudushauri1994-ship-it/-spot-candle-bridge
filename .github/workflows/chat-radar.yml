name: Chat Spot Radar 100
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: chat-spot-radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan 100 Bybit spot pairs
        run: python -m radar.chat_scan
      - name: Save report to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chat-radar/latest.json data/chat-radar/latest.md
          git diff --cached --quiet || (git commit -m "Update chat spot radar report" && git push)
