name: Bybit Kronos Research
on:
  push:
    branches: [main]
    paths: ['kronos/**', 'tests/test_kronos_inputs.py', '.github/workflows/kronos.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kronos-research
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Checkout bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: kronos/requirements.txt
      - name: Model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .hf-cache
          key: kronos-mini-f4e68697-tokenizer-26966d00
      - name: CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r kronos/requirements.txt
      - name: Test data gates
        run: python -m unittest discover -s tests -p test_kronos_inputs.py -v
      - name: Checkout original pinned Kronos code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: shiyu-coder/Kronos
          ref: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          path: .kronos-upstream
          persist-credentials: false
      - name: Real inference and chronological holdout evaluation
        run: python kronos/run.py --symbols BTCUSDT,SOLUSDT,PUMPUSDT
      - name: Publish result for ChatGPT
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kronos/input.json data/kronos/latest.json data/kronos/latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update actual Bybit Kronos research report'
          git pull --rebase origin main
          git push origin HEAD:main
